            {/* ============================================================== */}
            {/* OPERATOR TAB 5: WHAT-IF SIMULATOR */}
            {/* ============================================================== */}
            {role === 'OPERATOR' && activeTab === 'WHAT_IF' && (
              <div className="space-y-6">
                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6">
                  <div>
                    <h2 className="text-xl font-black text-white">What-If Grid Stress Simulator</h2>
                    <p className="text-xs text-slate-400">Simulate EV adoption spikes, holiday surges & feeder outages</p>
                  </div>

                  {/* Simulator Controls */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-950 p-5 rounded-xl border border-slate-800 text-xs">
                    <div className="space-y-2">
                      <label className="block text-slate-300 font-bold">Simulated EV Adoption Increase: +{whatIfScenario.adoptionRate}%</label>
                      <input
                        type="range"
                        min="0"
                        max="100"
                        value={whatIfScenario.adoptionRate}
                        onChange={(e) => setWhatIfScenario({ ...whatIfScenario, adoptionRate: Number(e.target.value) })}
                        className="w-full accent-emerald-500"
                      />
                    </div>
                    <div className="space-y-2">
                      <label className="block text-slate-300 font-bold">Traffic Peak Surge: +{whatIfScenario.trafficSurge}%</label>
                      <input
                        type="range"
                        min="0"
                        max="50"
                        value={whatIfScenario.trafficSurge}
                        onChange={(e) => setWhatIfScenario({ ...whatIfScenario, trafficSurge: Number(e.target.value) })}
                        className="w-full accent-cyan-500"
                      />
                    </div>
                  </div>

                  {/* Impact Calculation Results */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Projected Peak Load</span>
                      <strong className="text-amber-400 text-lg">{(4.82 * (1 + whatIfScenario.adoptionRate / 100)).toFixed(2)} GW</strong>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Transformer Overload Risk</span>
                      <strong className="text-red-400 text-lg">{Math.round(12 * (1 + whatIfScenario.adoptionRate / 50))} Feeders</strong>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Required Dynamic Incentive</span>
                      <strong className="text-emerald-400 text-lg">₹{(3.5 * (1 + whatIfScenario.adoptionRate / 100)).toFixed(1)} / kWh</strong>
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* FALLBACK DEFAULT TAB HANDLER */}
            {(activeTab === 'SPATIAL' || activeTab === 'GRID_CAPACITY') && (
              <div className="bg-slate-900 p-8 rounded-2xl border border-slate-800 text-center space-y-4">
                <Icon name="grid" className="w-12 h-12 text-cyan-400 mx-auto" />
                <h3 className="text-lg font-bold text-white">GIS Spatial Clustering & Grid Capacity Analysis</h3>
                <p className="text-xs text-slate-400 max-w-md mx-auto">
                  Running K-Means & DBSCAN Spatial clustering across 500+ Indian feeders. All telemetry data linked to dynamic map markers.
                </p>
                <button onClick={() => setActiveTab('OVERVIEW')} className="bg-emerald-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl">
                  Return to Overview Map
                </button>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            <p>SATHEE ⚡ Smart AI EV Charging & Grid Intelligence Platform — Academic & DISCOM Prototype</p>
            <p className="mt-1">Designed for India-Wide Electric Mobility Optimization</p>
          </footer>

          {/* ============================================================== */}
          {/* AUTHENTICATION MODAL DIALOG */}
          {/* ============================================================== */}
          {authModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-5 shadow-2xl relative">
                
                <button onClick={() => setAuthModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>

                {authError && (
                  <div className="bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-xl font-bold">
                    ⚠️ {authError}
                  </div>
                )}

                {/* LOGIN FORM */}
                {authModal === 'LOGIN' && (
                  <div className="space-y-4">
                    <h3 className="text-lg font-black text-white">Login to SATHEE ⚡</h3>
                    <input
                      type="text"
                      placeholder="Mobile (+91) or Email"
                      value={authForm.email}
                      onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white"
                    />
                    <input
                      type="password"
                      placeholder="Password"
                      value={authForm.password}
                      onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white"
                    />
                    <button
                      onClick={() => { setCurrentUser(DEMO_USER_INITIAL); setAuthModal(null); }}
                      className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 rounded-xl font-black text-xs shadow-lg"
                    >
                      LOGIN TO ACCOUNT
                    </button>
                    <div className="text-center pt-2">
                      <button onClick={() => setAuthModal('REGISTER')} className="text-xs text-emerald-400 font-bold hover:underline">
                        Don't have an account? Create Account
                      </button>
                    </div>
                  </div>
                )}

                {/* REGISTER FORM */}
                {authModal === 'REGISTER' && (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3">
                    <h3 className="text-lg font-black text-white">Create SATHEE Account</h3>
                    <input
                      type="text"
                      placeholder="Full Name (e.g. Ankit Sharma)"
                      required
                      value={authForm.fullName}
                      onChange={(e) => setAuthForm({ ...authForm, fullName: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white"
                    />
                    <input
                      type="tel"
                      placeholder="Mobile Number (+91 XXXXX XXXXX)"
                      required
                      value={authForm.mobile}
                      onChange={(e) => setAuthForm({ ...authForm, mobile: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white"
                    />
                    <input
                      type="email"
                      placeholder="Email Address"
                      required
                      value={authForm.email}
                      onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white"
                    />
                    <input
                      type="password"
                      placeholder="Password"
                      required
                      value={authForm.password}
                      onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white"
                    />
                    <input
                      type="password"
                      placeholder="Confirm Password"
                      required
                      value={authForm.confirmPassword}
                      onChange={(e) => setAuthForm({ ...authForm, confirmPassword: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white"
                    />
                    <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 rounded-xl font-black text-xs shadow-lg">
                      CREATE ACCOUNT & VERIFY →
                    </button>
                  </form>
                )}

                {/* MOBILE OTP */}
                {authModal === 'VERIFY_MOBILE' && (
                  <div className="space-y-4">
                    <h3 className="text-lg font-black text-white">Verify Mobile Number</h3>
                    <p className="text-xs text-slate-400">We sent a verification code to {authForm.mobile || '+91 9876543210'}</p>
                    <div className="bg-emerald-500/10 border border-emerald-500/30 p-2.5 rounded-xl text-xs text-emerald-400 font-bold text-center">
                      Demo OTP Code: 123456
                    </div>
                    <input
                      type="text"
                      placeholder="Enter 6-digit Mobile OTP"
                      maxLength="6"
                      value={mobileOtp}
                      onChange={(e) => setMobileOtp(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-center text-lg font-mono tracking-widest text-white"
                    />
                    <button onClick={handleVerifyMobile} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 rounded-xl font-black text-xs">
                      VERIFY MOBILE OTP ✓
                    </button>
                  </div>
                )}

                {/* EMAIL OTP */}
                {authModal === 'VERIFY_EMAIL' && (
                  <div className="space-y-4">
                    <h3 className="text-lg font-black text-white">Verify Email Address</h3>
                    <p className="text-xs text-slate-400">We sent a verification code to {authForm.email || 'user@example.com'}</p>
                    <div className="bg-emerald-500/10 border border-emerald-500/30 p-2.5 rounded-xl text-xs text-emerald-400 font-bold text-center">
                      Demo Email OTP Code: 654321
                    </div>
                    <input
                      type="text"
                      placeholder="Enter 6-digit Email OTP"
                      maxLength="6"
                      value={emailOtp}
                      onChange={(e) => setEmailOtp(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-center text-lg font-mono tracking-widest text-white"
                    />
                    <button onClick={handleVerifyEmail} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 rounded-xl font-black text-xs">
                      VERIFY EMAIL & COMPLETE ✓
                    </button>
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    // --- REUSABLE NAVIGATION BUTTON HELPER ---
    function NavBtn({ active, onClick, icon, label, badge, highlight }) {
      return (
        <button
          onClick={onClick}
          className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 whitespace-nowrap ${active ? 'bg-slate-800 text-emerald-400 border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}
        >
          <Icon name={icon} className={`w-4 h-4 ${highlight ? 'text-amber-400 animate-pulse' : ''}`} />
          <span>{label}</span>
          {badge !== undefined && (
            <span className="bg-emerald-500/20 text-emerald-400 text-[10px] px-1.5 py-0.2 rounded-full">{badge}</span>
          )}
        </button>
      );
    }

    // --- REUSABLE METRIC CARD HELPER ---
    function MetricCard({ title, value, subtext, icon, color }) {
      const colorMap = {
        emerald: 'text-emerald-400 border-emerald-500/30 bg-emerald-500/5',
        cyan: 'text-cyan-400 border-cyan-500/30 bg-cyan-500/5',
        amber: 'text-amber-400 border-amber-500/30 bg-amber-500/5',
        red: 'text-red-400 border-red-500/30 bg-red-500/5',
      };
      return (
        <div className={`p-4 rounded-2xl border ${colorMap[color]} space-y-1`}>
          <div className="flex justify-between items-center text-slate-400">
            <span className="text-[11px] font-bold uppercase tracking-wider">{title}</span>
            <Icon name={icon} className="w-4 h-4" />
          </div>
          <div className="text-2xl font-black text-white">{value}</div>
          <p className="text-[10px] text-slate-400 font-medium">{subtext}</p>
        </div>
      );
    }

    // MOUNT TO DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
